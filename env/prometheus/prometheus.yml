global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring boot app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:8080
  - job_name: 'k6'
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:6565