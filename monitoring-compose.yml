services:
  prometheus:
    image: prom/prometheus
    container_name: pref_prometheus
    volumes:
      - ./env/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    networks:
      - monitor
  grafana:
    image: grafana/grafana
    container_name: pref_grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./env/grafana:/var/lib/grafana/dashboards
      - ./env/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./env/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    environment:
      - GF_SECURITY_ADMIN_USER=root
      - GF_SECURITY_ADMIN_PASSWORD=root
    networks:
      - monitor
volumes:
  prom_data:

networks:
  monitor:
    driver: bridge