services:
  k6:
    image: grafana/k6
    volumes:
      - ./k6:/scripts
    ports:
      - "6565:6565"
    networks:
      - monitor
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    entrypoint: ["sleep", "infinity"]
    depends_on:
      - prometheus

networks:
  monitor:
    driver: bridge