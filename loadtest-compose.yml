services:
  influxdb:
    image: influxdb:1.11
    environment:
      - INFLUXDB_DB=k6
    ports:
      - "8086:8086"
    networks:
      - monitor
    volumes:
      - influxdb-storage:/var/lib/influxdb

  k6:
    image: grafana/k6
    volumes:
      - ./k6:/scripts
    networks:
      - monitor
    entrypoint: ["sleep", "infinity"]

volumes:
  influxdb-storage:

networks:
  monitor:
    driver: bridge